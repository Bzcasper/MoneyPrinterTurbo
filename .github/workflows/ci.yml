name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }} tests
    # Self-hosted only for same-repo events: this runner is a personal
    # machine, so fork PRs must never execute code on it.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    env:
      MPT_TEST_REDIS_HOST: 127.0.0.1
      MPT_TEST_REDIS_PORT: 6379
      MPT_TEST_REDIS_DB: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Start local test Redis on 6379
        run: |
          redis-server --port 6379 --save '' --appendonly no \
            --daemonize yes --pidfile /tmp/mpt-ci-redis-6379.pid --dir /tmp
          redis-cli -p 6379 ping

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Compile Python sources
        run: >-
          uv run --no-sync python -m compileall app cli.py main.py webui test docs/skill
          tools/jules_tasks.py tools/jules_autopilot.py tools/sync_upstream.py

      - name: Lint Python sources
        if: matrix.python-version == '3.11'
        run: >-
          uv run --no-sync ruff check app cli.py main.py webui test docs/skill
          tools/jules_tasks.py tools/jules_autopilot.py tools/sync_upstream.py

      - name: Run unit tests with coverage
        # pytest 兼容现有 unittest.TestCase，同时会收集仓库中的 pytest 风格
        # 测试，避免测试文件已存在但 CI 没有真正执行。
        run: uv run --no-sync python -X utf8 -m coverage run -m pytest -q test

      # Native project rendering is a separate mandatory pass; the self-hosted
      # runner ships FFmpeg, so verify instead of installing.
      - name: Verify FFmpeg for native revision-rendering tests
        run: |
          command -v ffmpeg
          ffmpeg -version | head -1

      - name: Run native revision-rendering tests
        run: >-
          uv run --no-sync python -X utf8 -m coverage run --append -m pytest -q
          test/services/test_video_project.py test/services/test_minimax_output_container.py

      - name: Report test coverage
        run: uv run --no-sync python -m coverage report

      - name: Export coverage report
        run: uv run --no-sync python -m coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 7

  windows-smoke:
    name: Windows smoke tests
    # Hosted Windows runners are currently blocked by the account billing lock;
    # this job stays defined so coverage can be restored by flipping the label
    # back to windows-latest once billing is resolved.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.11

      - name: Compile Python sources
        run: >-
          uv run --no-sync python -m compileall app cli.py main.py webui test docs/skill
          tools/jules_tasks.py tools/jules_autopilot.py tools/sync_upstream.py

      - name: Run core service smoke tests
        run: >-
          uv run --no-sync python -X utf8 -m pytest -q
          test/services/test_config.py
          test/services/test_state.py
          test/services/test_task.py
          test/services/test_task_manager.py
          test/services/test_upload_post.py
          test/services/test_controller_video.py
          test/services/test_webui_task.py
          test/services/test_webui_headless_task_actions.py
